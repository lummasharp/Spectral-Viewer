[package]
name = "spectral-viewer"
version = "0.3.1"
edition = "2024"
description = "A fast, minimal desktop image viewer"
license = "MIT"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
avif-decode = { version = "1", default-features = false }
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
kamadak-exif = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
resvg = "0.47"
rfd = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
